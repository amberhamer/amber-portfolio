<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="styles.css">

<body>

  <header class="site-nav">
    <a href="index.html" class="site-nav__brand">Amber Hamersfeld</a>
    <nav class="site-nav__primary" aria-label="Primary">
      <a href="index.html" class="is-active">Work</a>

    <div class="site-nav__right">

  <section class="slideshow">
    <!-- SLIDESHOW:START -->
    <style>
      .slideshow__slide { animation-duration: 25s; }
      @keyframes slideshow-fade {
        0% { opacity: 0; }
        4.000% { opacity: 1; }
        16.000% { opacity: 1; }
        20.000% { opacity: 0; }
        100% { opacity: 0; }
      }
    </style>
    <div class="slideshow__slide" style="animation-delay: 0s"><img src="slideshow/alchemy_homepage_16x9.png" alt=""></div>
    <div class="slideshow__slide" style="animation-delay: 5s"><img src="slideshow/bloomed_homepage_16x9.png" alt=""></div>
    <div class="slideshow__slide" style="animation-delay: 10s"><img src="slideshow/brumbys_homepage_16x9.png" alt=""></div>
    <div class="slideshow__slide" style="animation-delay: 15s"><img src="slideshow/mrs_matcha_homepage_16x9.png" alt=""></div>
    <div class="slideshow__slide" style="animation-delay: 20s"><img src="slideshow/natures_navigator_homepage_16x9.png" alt=""></div>
    <!-- SLIDESHOW:END -->
    <p class="slideshow__tagline">A portfolio of selected brand and packaging work.</p>
  </section>

  <div class="filter-bar" aria-hidden="true"></div>

  <main class="portfolio">
    <div class="portfolio__grid">

      <a href="alchemy.html" class="tile tile--landscape">
        <div class="tile__media">
          <img src="hero/alchemy.gif" alt="Alchemy">
        </div>
        <div class="tile__caption">
          <span class="tile__title">Alchemy</span>
          <span class="tile__meta">Brand Concept</span>

          <img src="hero/bloomed.jpg" alt="Bloomed">
        </div>
        <div class="tile__caption">
          <span class="tile__title">Bloomed</span>
          <span class="tile__meta">Brand Concept</span>
        </div>
      </a>

      <a href="brumbys.html" class="tile tile--landscape">
        <div class="tile__media">
          <img src="hero/brumbys.jpg" alt="Brumbys Bakery">
        </div>
        <div class="tile__caption">
          <span class="tile__title">Brumbys Bakery</span>
          <span class="tile__meta">Brand Redesign</span>
        </div>

      <a href="mrs_matcha.html" class="tile tile--landscape">

          <img src="hero/natures_navigator.jpg" alt="Nature's Navigator">
        </div>
        <div class="tile__caption">
          <span class="tile__title">Nature's Navigator</span>
          <span class="tile__meta">Board Game Design</span>
        </div>
      </a>

    </div>

  <footer class="site-footer">
    <span>© Amber Hamersfeld</span>
    <span>Selected work, 2024 to present</span>
  </footer>
